[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.build]
description = "Generate dist/install.sh"
run = "./build"

[tasks.check]
description = "Build, lint, check formatting and run the tests"
depends = ["build"]
run = [
	"shellcheck dist/install.sh build bin/* tests/*.sh tests/e2e/*.sh",
	"shfmt -ln bash -d .",
	"tests/guards.sh",
	"tests/config.sh",
	"tests/quiet.sh",
]

[tasks.release]
description = "Tag and push a signed release: mise run release vX.Y.Z"
run = "bin/release"
