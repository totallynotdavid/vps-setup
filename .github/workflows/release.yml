name: release

# A tag publishes. A pull request or a manual run does everything a tag does
# except the final upload, so a release that would fail fails before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      # Publish reads no secret. Its only credential is GITHUB_TOKEN, which GitHub
      # issues. A job that names a missing environment waits for an approval that
      # nobody can give, so every environment a job names must exist.
      - name: Check every environment a job names exists
        run: |
          names=$(yq '.jobs[].environment | select(. != null) | (.name // .)' .github/workflows/release.yml)
          for name in $names; do
            gh api "repos/$GITHUB_REPOSITORY/environments/$name" --silent ||
              { echo "environment '$name' does not exist in $GITHUB_REPOSITORY" >&2; exit 1; }
          done
      - name: Check the tag has no release yet
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a release for $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the notes name this version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            bin/check-release-notes .github/release-notes.md "$GITHUB_REF_NAME"
          else
            bin/check-release-notes .github/release-notes.md
          fi
      - run: ./build
      - name: Check the checksum and that a second build is identical
        run: |
          (cd dist && sha256sum --check install.sh.sha256)
          cp -r dist "$RUNNER_TEMP/first"
          ./build
          diff -r "$RUNNER_TEMP/first" dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/install.sh
            dist/install.sh.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/install.sh dist/install.sh.sha256 --verify-tag --notes-file .github/release-notes.md --generate-notes
